services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planbig
      POSTGRES_PASSWORD: planbig_dev
      POSTGRES_DB: planbig
    ports:
      - "5432:5432"
    volumes:
      - planbig_pgdata:/var/lib/postgresql/data
volumes:
  planbig_pgdata:
